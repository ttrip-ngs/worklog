<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)" />
    <!-- 保存済みのテーマを初回描画前に反映する。type="module" にすると Vite が defer 相当で
         読み込み、ライトで一瞬描画されてから暗転する(FOUC)ため、あえて同期スクリプトにする。 -->
    <script>try{var t=localStorage.getItem("worklog.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>稼働実績管理</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
